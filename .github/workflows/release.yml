name: Release

# One action ships a release: Actions → Release → Run workflow (leave the tag blank to release
# the package.json version), or push a tag. The job type-checks, builds and verifies the tagged
# source (npm run verify), zips the site (it opens straight from disk), and creates the GitHub
# release with notes from docs/releases/<tag>.md, falling back to that version's CHANGELOG
# section. Re-running replaces the zip.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (leave blank for the package.json version)
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # The typed tag is cleaned before it is checked: spaces and trailing dots are dropped
      # (a tag copied out of a sentence arrives as "v0.2.0.") and a missing "v" is added.
      - name: Resolve the tag
        env:
          RAW: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
        run: |
          want="v$(node -p "require('./package.json').version")"
          tag="$(printf '%s' "$RAW" | tr -d '[:space:]' | sed 's/\.*$//')"
          [ -n "$tag" ] || tag="$want"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          [ "$tag" = "$want" ] || { echo "::error::tag $tag does not match package.json ($want)"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $tag"

      - run: npm ci
      - run: npm run check
      # verify drives the runner's own Google Chrome when the image has one (Playwright's
      # bundled browser lags new runner OS releases), else installs Playwright's Chromium
      - name: Browser for verify
        run: |
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; google-chrome --version
          else npx playwright install --with-deps chromium; fi
      - run: npm run verify

      - name: Package the site
        run: |
          mv dist "crimson-compendium-${TAG}"
          zip -qr "crimson-compendium-${TAG}.zip" "crimson-compendium-${TAG}"

      - name: Release notes
        run: |
          if [ -f "docs/releases/${TAG}.md" ]; then
            head -n1 "docs/releases/${TAG}.md" | sed 's/^# *//' > title.txt
            tail -n +2 "docs/releases/${TAG}.md" > notes.md
          else
            echo "$TAG" > title.txt
            awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          fi

      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "crimson-compendium-${TAG}.zip" --clobber
          else
            gh release create "$TAG" "crimson-compendium-${TAG}.zip" \
              --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md
          fi
