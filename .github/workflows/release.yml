name: Release

# One action ships a release: Actions → Release → Run workflow (enter the tag, e.g. v0.2.0),
# or push a tag. The job type-checks and builds the tagged source, zips the site (it opens
# straight from disk), and creates the GitHub release with notes from docs/releases/<tag>.md,
# falling back to that version's CHANGELOG section. Re-running replaces the zip.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, e.g. v0.2.0
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the version matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$want" ] || { echo "::error::tag $TAG does not match package.json ($want)"; exit 1; }

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Package the site
        run: |
          mv dist "crimson-compendium-${TAG}"
          zip -qr "crimson-compendium-${TAG}.zip" "crimson-compendium-${TAG}"

      - name: Release notes
        run: |
          if [ -f "docs/releases/${TAG}.md" ]; then
            head -n1 "docs/releases/${TAG}.md" | sed 's/^# *//' > title.txt
            tail -n +2 "docs/releases/${TAG}.md" > notes.md
          else
            echo "$TAG" > title.txt
            awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          fi

      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "crimson-compendium-${TAG}.zip" --clobber
          else
            gh release create "$TAG" "crimson-compendium-${TAG}.zip" \
              --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md
          fi
