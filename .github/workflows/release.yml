name: Release

# Publishing a GitHub release builds the site from the tagged source and attaches it as a zip
# that opens straight from disk (unzip, open index.html).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mv dist "crimson-compendium-${TAG}"
          zip -qr "crimson-compendium-${TAG}.zip" "crimson-compendium-${TAG}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "crimson-compendium-${TAG}.zip" --clobber
