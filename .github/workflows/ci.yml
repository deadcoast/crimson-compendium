name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # builds, then checks the built site headless: data lint, every route, explorer, phone,
      # accessibility, self-contained (tools/verify.mjs)
      - run: npm run verify
      - uses: actions/upload-artifact@v6
        with:
          name: crimson-compendium-site
          path: dist
